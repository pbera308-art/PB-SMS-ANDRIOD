name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Gradle Project & Make gradlew Executable
        id: find-gradle
        run: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "Error: gradlew not found in repository!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          fi
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSP-SMS-Android-APK
          path: ${{ steps.find-gradle.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          retention-days: 30
